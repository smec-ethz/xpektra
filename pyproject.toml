[project]
name = "xpektra"
version = "0.5.0"
description = "Differentiable framework for spectral methods"
authors = [
    { name = "Mohit Pundir", email = "mpundir@ethz.ch" },
]
license = "LGPL-3.0"
license-files = ["COPYING", "COPYING.LESSER"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.9.0",
    "numpy",
    "scipy",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
]
docs = [
    "jupytext>=1.18.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-include-exclude-files>=0.1.0",
    "mkdocs-ipynb>=0.1.1",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material>=9.6.23",
    "mkdocstrings-python>=1.18.2",
    "mkdocs-section-index>=0.3.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = [ "hatchling", ]
build-backend = "hatchling.build"

[project.urls]
repository = "https://github.com/smec-ethz/xpektra"
